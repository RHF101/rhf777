<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crash — RHF 777</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
    body { background: #0a0a0f; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .header-game { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #14141f; border-bottom: 1px solid #2a2a3a; z-index: 10;}
    .tombol-kembali { color: #8b8b9e; text-decoration: none; font-size: 24px; }
    .saldo-game { font-size: 18px; font-weight: bold; color: #00e701; }

    .area-grafik { flex: 1; position: relative; background: #0a0a0f; width: 100%; }
    
    .status-tengah { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10; pointer-events: none; width: 100%; }
    .angka-pengali { font-size: 80px; font-weight: 900; color: #00e701; text-shadow: 0 4px 20px rgba(0,231,1,0.3); transition: color 0.2s; }
    .angka-pengali.crashed { color: #ff3838; text-shadow: 0 4px 20px rgba(255,56,56,0.3); }
    .angka-pengali.peringatan { color: #ffd700; text-shadow: 0 4px 20px rgba(255,215,0,0.3); animation: kedip 0.5s infinite; }
    @keyframes kedip { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .hitung-mundur { font-size: 40px; font-weight: bold; color: #ffd700; }
    
    canvas { width: 100% !important; height: 100% !important; position: absolute; top: 0; left: 0; }

    .panel-kontrol { background: #14141f; border-top: 1px solid #2a2a3a; padding: 15px 20px 20px; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 20px rgba(0,0,0,0.5); z-index: 20; }
    
    .grup-nominal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .btn-nominal { padding: 8px 0; background: #1e1e2e; border: 1px solid #2a2a3a; color: #fff; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-nominal:hover { background: #2a2a3a; border-color: #ffd700; }

    .wadah-input { position: relative; margin-bottom: 10px; }
    .input-taruhan { width: 100%; padding: 15px; background: #0a0a0f; border: 2px solid #2a2a3a; color: #fff; border-radius: 10px; font-size: 20px; font-weight: bold; outline: none; text-align: center; }
    .input-taruhan:focus { border-color: #00e701; }
    .label-taruhan { position: absolute; top: -8px; left: 15px; background: #14141f; padding: 0 5px; font-size: 11px; color: #8b8b9e; }

    .btn-aksi { width: 100%; padding: 18px; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; transition: transform 0.1s; }
    .btn-aksi:active { transform: scale(0.97); }
    .btn-mulai { background: linear-gradient(135deg, #00e701, #00b301); color: #000; }
    .btn-mulai:disabled { background: #1e1e2e; color: #8b8b9e; cursor: not-allowed; }
    
    .grup-tombol { display: flex; gap: 10px; display: none; }
    .btn-setengah { flex: 1; background: #4a9eff; color: #fff; font-size: 14px; }
    .btn-tarik { flex: 2; background: linear-gradient(135deg, #ffd700, #ffb800); color: #000; }

    .pesan { margin-top: 10px; font-weight: bold; font-size: 13px; min-height: 18px; text-align: center; }
  </style>
</head>
<body>

  <div class="header-game">
    <a href="../slot.html" class="tombol-kembali">←</a>
    <div class="saldo-game">Saldo: <span id="saldoSekarang">0</span></div>
  </div>
  
  <div class="area-grafik" id="wadahGrafik">
    <div class="status-tengah" id="statusTengah">
      <div class="hitung-mundur" id="teksHitung">Menunggu...</div>
      <div class="angka-pengali" id="teksPengali" style="display:none;">1.00x</div>
    </div>
    <canvas id="kanvasGrafik"></canvas>
  </div>
  
  <div class="panel-kontrol">
    <div id="panelInput">
      <div class="grup-nominal">
        <button class="btn-nominal" onclick="setTaruhan(1000)">1.000</button>
        <button class="btn-nominal" onclick="setTaruhan(5000)">5.000</button>
        <button class="btn-nominal" onclick="setTaruhan(10000)">10.000</button>
        <button class="btn-nominal" onclick="setTaruhan(50000)">50.000</button>
      </div>
      <div class="wadah-input">
        <span class="label-taruhan">BET (Rp)</span>
        <input type="number" id="inputTaruhan" class="input-taruhan" placeholder="0" value="1000">
      </div>
      <button class="btn-aksi btn-mulai" id="btnMulai" onclick="pasangTaruhan()">PASANG TARUHAN</button>
    </div>
    
    <div class="grup-tombol" id="grupAksi">
      <button class="btn-aksi btn-setengah" id="btnSetengah" onclick="tarikSetengah()">TARIK 50%</button>
      <button class="btn-aksi btn-tarik" id="btnTarik" onclick="tarikDana()">TARIK SEMUA</button>
    </div>

    <div class="pesan" id="pesan"></div>
  </div>

  <script type="module" src="../assets/firebase.js"></script>
  <script>
    let saldoPemain = 0;
    let usernamePemain = "Pemain";
    let idUser = null;
    let multiplierSekarang = 1.00;
    let intervalNaik = null;
    let statusGame = "menunggu"; 
    let sudahTarikSetengah = false;
    let sudahTarikSemua = false;
    let taruhanAktif = 0;
    let sudahPasangTaruhan = false;
    
    let skenario = []; 
    let indexSkenario = 0;
    
    let canvas, ctx;
    let dataGrafik = []; // Menyimpan data: {open, high, low, close}
    let animasiFrame;

    function setTaruhan(angka) {
      document.getElementById("inputTaruhan").value = angka;
    }

    // ============ MESIN GRAFIK CANDLESTICK CANVAS ============
    function inisialisasiKanvas() {
      canvas = document.getElementById('kanvasGrafik');
      ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      dataGrafik = [];
      gambarUlangGrafik();
    }

    function gambarUlangGrafik() {
      if(!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if(dataGrafik.length === 0) {
        animasiFrame = requestAnimationFrame(gambarUlangGrafik);
        return;
      }

      // Garis Grid
      ctx.strokeStyle = "#1e1e2e";
      ctx.lineWidth = 1;
      for(let i=0; i<canvas.height; i+=50) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Skala Y
      let maxY = Math.max(...dataGrafik.map(d => d.high));
      let minY = Math.min(...dataGrafik.map(d => d.low));
      if(maxY < 1.5) maxY = 1.5; 
      if(minY > 0.5) minY = 0.5;
      
      let rangeY = maxY - minY;
      if(rangeY < 0.5) rangeY = 0.5;

      let lebarCandle = (canvas.width / dataGrafik.length) * 0.7;
      if(lebarCandle < 2) lebarCandle = 2;
      if(lebarCandle > 15) lebarCandle = 15;

      for(let i=0; i<dataGrafik.length; i++) {
        let d = dataGrafik[i];
        let x = (i / dataGrafik.length) * canvas.width + (canvas.width / dataGrafik.length)/2;
        
        // Posisi Y (terbalik, 0 di atas)
        let yOpen = canvas.height - ((d.open - minY) / rangeY) * (canvas.height - 20) - 10;
        let yClose = canvas.height - ((d.close - minY) / rangeY) * (canvas.height - 20) - 10;
        let yHigh = canvas.height - ((d.high - minY) / rangeY) * (canvas.height - 20) - 10;
        let yLow = canvas.height - ((d.low - minY) / rangeY) * (canvas.height - 20) - 10;

        let isNaik = d.close >= d.open;
        let warna = isNaik ? "#00e701" : "#ff3838";

        // Jika status meledak, candle terakhir dipaksa merah panjang
        if(statusGame === "meledak" && i === dataGrafik.length - 1) {
          warna = "#ff3838";
          yLow = canvas.height; 
        }

        // Gambar Sumbu (Wick)
        ctx.strokeStyle = warna;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // Gambar Badan Candle
        ctx.fillStyle = warna;
        let yBadan = Math.min(yOpen, yClose);
        let tinggiBadan = Math.abs(yOpen - yClose);
        if(tinggiBadan < 1) tinggiBadan = 1; // Minimal 1px

        ctx.fillRect(x - lebarCandle/2, yBadan, lebarCandle, tinggiBadan);
      }

      if(statusGame === "terbang") {
        animasiFrame = requestAnimationFrame(gambarUlangGrafik);
      }
    }

    // ============ FIREBASE & GAME LOGIC ============
    setTimeout(() => {
      if(window.fbAuth) {
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          if(user) {
            idUser = user.uid;
            const snap = await window.fbGet(window.fbRef(window.fbDb, "users/" + user.uid));
            if(snap.exists()) {
              saldoPemain = Number(snap.val().balance);
              usernamePemain = snap.val().username;
              document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
            }
            mulaiRondeBaru();
          } else {
            window.location.href = "../index.html";
          }
        });
      }
    }, 1000);

    function buatSkenarioDrama() {
      skenario = [];
      let nilaiSekarang = 1.00;
      let batasMeledak = (Math.random() * 15) + 1.5;
      let jumlahDrama = Math.floor(Math.random() * 5) + 3;
      
      for(let d=0; d<jumlahDrama; d++) {
        let naikKecil = nilaiSekarang + (Math.random() * 1.5) + 0.5;
        skenario.push({ tipe: 'naik', target: naikKecil, durasi: 20 });
        nilaiSekarang = naikKecil;
        
        let turunEkstrem = nilaiSekarang - (Math.random() * (nilaiSekarang * 0.6));
        if(turunEkstrem < 1.05) turunEkstrem = 1.05;
        skenario.push({ tipe: 'turun_ekstrem', target: turunEkstrem, durasi: 15 });
        nilaiSekarang = turunEkstrem;

        let melesatNaik = nilaiSekarang + (Math.random() * 2) + 1;
        skenario.push({ tipe: 'naik_ekstrem', target: melesatNaik, durasi: 15 });
        nilaiSekarang = melesatNaik;
      }
      
      skenario.push({ tipe: 'meledak', target: batasMeledak, durasi: 30 });
    }

    function mulaiRondeBaru() {
      statusGame = "menunggu";
      sudahPasangTaruhan = false;
      sudahTarikSemua = false;
      taruhanAktif = 0;
      multiplierSekarang = 1.00;
      sudahTarikSetengah = false;
      
      document.getElementById("btnMulai").disabled = false;
      document.getElementById("btnMulai").textContent = "PASANG TARUHAN";
      document.getElementById("grupAksi").style.display = "none";
      document.getElementById("panelInput").style.display = "block";
      document.getElementById("pesan").textContent = "";
      document.getElementById("teksPengali").style.display = "none";
      document.getElementById("teksHitung").style.display = "block";

      inisialisasiKanvas();
      buatSkenarioDrama();
      indexSkenario = 0;
      
      let hitung = 10;
      document.getElementById("teksHitung").textContent = hitung + "s";
      
      let intervalHitung = setInterval(() => {
        hitung--;
        if(hitung <= 0) {
          clearInterval(intervalHitung);
          mulaiTerbang();
        } else {
          document.getElementById("teksHitung").textContent = hitung + "s";
        }
      }, 1000);
    }

    function pasangTaruhan() {
      if(statusGame === "terbang") return;
      const taruhan = Number(document.getElementById("inputTaruhan").value);
      if(taruhan < 100) return alert("Minimal taruhan Rp 100");
      if(taruhan > saldoPemain) return alert("Saldo tidak cukup!");

      saldoPemain -= taruhan;
      document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
      window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
      
      taruhanAktif = taruhan;
      sudahPasangTaruhan = true;
      document.getElementById("btnMulai").disabled = true;
      document.getElementById("btnMulai").textContent = "TARUHAN TERPASANG";
      document.getElementById("pesan").style.color = "#ffd700";
      document.getElementById("pesan").textContent = `Taruhan Rp ${taruhan.toLocaleString('id-ID')} terpasang.`;
    }

    function mulaiTerbang() {
      statusGame = "terbang";
      multiplierSekarang = 1.00;
      document.getElementById("teksHitung").style.display = "none";
      document.getElementById("teksPengali").style.display = "block";
      document.getElementById("teksPengali").className = "angka-pengali";
      document.getElementById("teksPengali").textContent = "1.00x";
      
      if(sudahPasangTaruhan) {
        document.getElementById("grupAksi").style.display = "flex";
        document.getElementById("btnSetengah").style.display = "block";
        document.getElementById("btnSetengah").disabled = false;
        document.getElementById("panelInput").style.display = "none";
      }

      // Mulai dengan 1 candle awal
      dataGrafik.push({ open: 1, high: 1.01, low: 0.99, close: 1.00 });
      gambarUlangGrafik();

      jalankanSkenario();
    }

    function jalankanSkenario() {
      if(indexSkenario >= skenario.length) return;
      
      let tahap = skenario[indexSkenario];
      let target = tahap.target;
      let tick = 0;
      let kecepatan = 0.05;
      
      if(tahap.tipe === 'naik_ekstrem') kecepatan = 0.2; 
      if(tahap.tipe === 'turun_ekstrem') kecepatan = 0.3; 
      
      intervalNaik = setInterval(() => {
        tick++;
        
        // Logika Fluktuasi Candle (Naik Turun Dikit)
        let arah = (target > multiplierSekarang) ? 1 : -1;
        let fluktuasi = (Math.random() - 0.5) * 0.05; // Naik turun kecil
        let perubahan = (kecepatan * arah) + fluktuasi;
        
        let openCandle = multiplierSekarang;
        multiplierSekarang += perubahan;
        let closeCandle = multiplierSekarang;
        
        // Jika melewati target, tarik kembali
        if((arah === 1 && closeCandle > target) || (arah === -1 && closeCandle < target)) {
          closeCandle = target;
          multiplierSekarang = target;
        }

        // Hitung High dan Low untuk candle
        let highCandle = Math.max(openCandle, closeCandle) + (Math.random() * 0.02);
        let lowCandle = Math.min(openCandle, closeCandle) - (Math.random() * 0.02);
        if(lowCandle < 0.5) lowCandle = 0.5; // Jaga agar tidak minus

        // Efek Visual
        if(tahap.tipe === 'turun_ekstrem') {
          document.getElementById("teksPengali").className = "angka-pengali peringatan";
        } else {
          document.getElementById("teksPengali").className = "angka-pengali";
        }

        document.getElementById("teksPengali").textContent = multiplierSekarang.toFixed(2) + "x";
        
        // Tambahkan candle baru ke grafik
        dataGrafik.push({ open: openCandle, high: highCandle, low: lowCandle, close: closeCandle });

        if(tick >= tahap.durasi || multiplierSekarang === target) {
          clearInterval(intervalNaik);
          
          if(tahap.tipe === 'meledak') {
            meledak();
          } else {
            indexSkenario++;
            setTimeout(jalankanSkenario, 300); // Jeda sedikit antar tahap
          }
        }
      }, 100); 
    }

    async function tarikSetengah() {
      if(statusGame !== "terbang" || !sudahPasangTaruhan || sudahTarikSetengah) return;
      sudahTarikSetengah = true;
      document.getElementById("btnSetengah").disabled = true;
      
      const nilaiSekarang = taruhanAktif * multiplierSekarang;
      const dapatSetengah = Math.floor(nilaiSekarang / 2);
      
      saldoPemain += dapatSetengah;
      await window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
      document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
      
      document.getElementById("pesan").style.color = "#4a9eff";
      document.getElementById("pesan").textContent = `Tarik 50%: +Rp ${dapatSetengah.toLocaleString('id-ID')}`;
      
      taruhanAktif = taruhanAktif / 2;
    }

    async function tarikDana() {
      if(statusGame !== "terbang" || !sudahPasangTaruhan || sudahTarikSemua) return;
      sudahTarikSemua = true;
      
      const nilaiSekarang = taruhanAktif * multiplierSekarang;
      const kemenangan = Math.floor(nilaiSekarang);
      
      document.getElementById("grupAksi").style.display = "none";
      document.getElementById("pesan").style.color = "#00e701";
      document.getElementById("pesan").textContent = `Tarik! + Rp ${kemenangan.toLocaleString('id-ID')}. Tonton dramanya!`;

      saldoPemain += kemenangan;
      await window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
      document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
      
      if(window.simpanRiwayat) window.simpanRiwayat(idUser, usernamePemain, "Crash", true, kemenangan);
    }

    async function meledak() {
      clearInterval(intervalNaik);
      statusGame = "meledak";
      
      document.getElementById("teksPengali").className = "angka-pengali crashed";
      document.getElementById("teksPengali").textContent = "CRASH!";
      document.getElementById("grupAksi").style.display = "none";
      document.getElementById("pesan").style.color = "#ff3838";
      
      if(!sudahPasangTaruhan) {
        document.getElementById("pesan").textContent = "Roket meledak!";
      } else if(sudahTarikSemua) {
        document.getElementById("pesan").textContent = "Roket meledak! Anda sudah mengamankan uang.";
      } else {
        document.getElementById("pesan").textContent = "Anda Kalah.";
      }

      // Candle Terakhir: Jatuh ekstrem mentok ke 0
      dataGrafik.push({ open: multiplierSekarang, high: multiplierSekarang, low: 0, close: 0 });
      gambarUlangGrafik();

      if(!sudahTarikSemua && sudahPasangTaruhan && window.simpanRiwayat) {
        window.simpanRiwayat(idUser, usernamePemain, "Crash", false, taruhanAktif);
      }
      
      setTimeout(mulaiRondeBaru, 4000); 
    }

    window.addEventListener('resize', inisialisasiKanvas);
  </script>
</body>
</html>
