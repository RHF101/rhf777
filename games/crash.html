<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crash — RHF 777</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
    
    body { 
      background: #0f1115; color: #e2e8f0; 
      height: 100vh; height: 100dvh; 
      display: flex; flex-direction: column; overflow: hidden; position: fixed; width: 100vw; top: 0; left: 0;
    }

    /* HEADER */
    .header-game { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 12px 20px; background: #1a1d24; border-bottom: 1px solid #2d333b; z-index: 10;
    }
    .tombol-kembali { 
      color: #94a3b8; text-decoration: none; display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 8px; background: #0f1115; border: 1px solid #2d333b; transition: 0.2s;
    }
    .tombol-kembali:hover { background: #2d333b; color: #fff; }

    .header-kanan { display: flex; align-items: center; gap: 8px; }
    .btn-suara {
      width: 36px; height: 36px; border-radius: 8px; background: #0f1115; border: 1px solid #2d333b;
      color: #94a3b8; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
    }
    .btn-suara.aktif { color: #10b981; border-color: #10b981; }
    
    .saldo-box { 
      display: flex; align-items: center; gap: 8px; 
      background: #0f1115; padding: 8px 16px; border-radius: 12px; border: 1px solid #2d333b;
    }
    .saldo-icon { width: 18px; height: 18px; fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .saldo-text { display: flex; flex-direction: column; }
    .saldo-label { font-size: 10px; color: #94a3b8; letter-spacing: 0.5px; margin-bottom: 2px; }
    .saldo-game { font-size: 16px; font-weight: 700; color: #fff; }
    .saldo-game span { font-size: 16px; font-weight: 700; color: #fff; }

    /* GRAFIK */
    .area-grafik { flex: 1; position: relative; width: 100%; min-height: 0; background: #0f1115; }
    .status-tengah { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10; pointer-events: none; width: 100%; }
    .angka-pengali { font-size: 80px; font-weight: 700; color: #10b981; transition: color 0.2s; letter-spacing: -2px; }
    .angka-pengali.crashed { color: #ef4444; }
    .hitung-mundur { font-size: 20px; font-weight: 600; color: #94a3b8; }
    .fair-tag { font-size: 10px; color: #4b5563; margin-top: 6px; letter-spacing: 0.5px; }
    canvas { width: 100% !important; height: 100% !important; position: absolute; top: 0; left: 0; }

    /* RIWAYAT ATAS */
    .riwayat-atas { 
      background: #1a1d24; padding: 10px 0; border-bottom: 1px solid #2d333b; 
      display: flex; overflow: hidden; white-space: nowrap; 
    }
    .riwayat-track { display: flex; gap: 8px; animation: scrollKiri 30s linear infinite; padding-left: 20px; }
    .riwayat-item { background: #0f1115; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: #10b981; border: 1px solid #2d333b; }
    .riwayat-item.merah { color: #ef4444; }
    @keyframes scrollKiri { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* PANEL BOT */
    .panel-bot-wrapper { position: absolute; bottom: 0; left: 0; right: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .panel-bot-wrapper.terbuka { transform: translateY(0); }
    .btn-toggle-bot { 
      background: #1a1d24; border: 1px solid #2d333b; border-bottom: none; 
      border-radius: 8px 8px 0 0; padding: 8px 20px; color: #94a3b8; font-weight: 600; font-size: 12px; cursor: pointer; 
      display: flex; align-items: center; gap: 6px; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); 
    }
    .btn-toggle-bot svg { width: 14px; height: 14px; transition: transform 0.3s; }
    .panel-bot-wrapper.terbuka .btn-toggle-bot svg { transform: rotate(180deg); }

    .papan-skor-bot { 
      width: 100%; max-width: 800px; height: 200px; background: #1a1d24; 
      border-top: 1px solid #2d333b; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto;
    }
    .papan-skor-bot::-webkit-scrollbar { width: 4px; }
    .papan-skor-bot::-webkit-scrollbar-thumb { background: #2d333b; border-radius: 2px; }
    .skor-item { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 10px; border-radius: 6px; background: #0f1115; }
    .skor-item.bot { color: #94a3b8; }
    .skor-item.kamu { color: #fff; font-weight: 600; border: 1px solid #3b82f6; background: rgba(59, 130, 246, 0.1); }
    .skor-win { color: #10b981; font-weight: 600; }
    .skor-lose { color: #ef4444; font-weight: 600; }

    /* PANEL KONTROL BAWAH */
    .panel-kontrol { 
      background: #1a1d24; border-top: 1px solid #2d333b; padding: 12px 20px; 
      z-index: 30; display: flex; flex-direction: column; gap: 14px; width: 100%; flex-shrink: 0;
      max-height: 56vh; overflow-y: auto;
    }

    /* TAB DUAL BET */
    .tab-bet { display: flex; gap: 6px; }
    .tab-bet-btn {
      flex: 1; padding: 8px; text-align: center; background: #0f1115; border: 1px solid #2d333b; border-radius: 8px;
      color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .tab-bet-btn.aktif { border-color: #3b82f6; color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    .tab-bet-btn .dot-aktif { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #10b981; margin-right: 5px; vertical-align: middle; }

    .slot-bet { display: none; flex-direction: column; gap: 10px; }
    .slot-bet.tampil { display: flex; }

    /* KOLOM KEMENANGAN REAL-TIME */
    .panel-kemenangan {
      display: none;
      background: #0f1115; border: 1px solid #f59e0b; border-radius: 8px;
      padding: 12px; text-align: center;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
    }
    .teks-kemenangan-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .teks-kemenangan-nominal { font-size: 26px; font-weight: 700; color: #f59e0b; }
    
    .baris-auto { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-auto { 
      background: #0f1115; border: 1px solid #2d333b; border-radius: 8px; padding: 10px 12px; 
      color: #94a3b8; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;
    }
    .btn-auto span { color: #fff; font-size: 13px; }
    .btn-auto.aktif { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .btn-auto.aktif span { color: #3b82f6; }
    .btn-auto input {
      width: 54px; background: transparent; border: none; color: #fff; font-weight: 700; font-size: 13px; text-align: right; outline: none;
    }
    .btn-auto.aktif input { color: #3b82f6; }

    .baris-taruhan { display: flex; align-items: center; gap: 8px; }
    .btn-chip { background: #0f1115; border: 1px solid #2d333b; border-radius: 6px; color: #e2e8f0; font-weight: 600; padding: 10px 14px; cursor: pointer; font-size: 13px; flex-shrink: 0; transition: 0.2s; }
    .btn-chip:hover { background: #2d333b; }
    .input-container { flex: 1; background: #0f1115; border: 1px solid #2d333b; border-radius: 6px; display: flex; align-items: center; padding: 0 12px; }
    .input-taruhan { width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 600; padding: 10px 0; outline: none; text-align: center; }

    .tombol-utama { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
    .btn-konfirmasi { background: #10b981; color: #000; }
    .btn-konfirmasi:disabled { background: #2d333b; color: #94a3b8; cursor: not-allowed; }
    .btn-tarik { background: #f59e0b; color: #000; display: none; }
    .btn-setengah { background: #3b82f6; color: #fff; display: none; font-size: 14px; margin-top: 8px; }

    @media (min-width: 768px) {
      .panel-kontrol { padding: 15px 20%; gap: 12px; }
      .papan-skor-bot { grid-template-columns: 1fr 1fr 1fr 1fr; height: 250px; }
      .angka-pengali { font-size: 120px; }
      .btn-chip { padding: 12px 20px; font-size: 14px; }
      .tombol-utama { padding: 20px; font-size: 18px; }
      .teks-kemenangan-nominal { font-size: 32px; }
    }
  </style>
</head>
<body>

  <div class="header-game">

      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>

  <div class="area-grafik" id="wadahGrafik">

  <div class="panel-kontrol">

    <div class="tab-bet">

      <div class="tab-bet-btn" id="tabBet2" onclick="pindahTab(2)">

    </div>

    <!-- SLOT BET 1 -->
    <div class="slot-bet tampil" id="slotBet1">
      <div class="panel-kemenangan" id="panelKemenangan1">

        <button class="tombol-utama btn-tarik" id="btnTarik1" onclick="tarikDana(1)" style="display: block;">TARIK SEMUA</button>
        <button class="tombol-utama btn-setengah" id="btnSetengah1" onclick="tarikSetengah(1)">TARIK 50%</button>

    <!-- SLOT BET 2 -->
    <div class="slot-bet" id="slotBet2">
      <div class="panel-kemenangan" id="panelKemenangan2">
        <div class="teks-kemenangan-label">Potensi Kemenangan</div>
        <div class="teks-kemenangan-nominal">Rp <span id="angkaKemenangan2">0</span></div>
      </div>

      <div class="baris-auto">
        <div class="btn-auto" id="btnAuto2" onclick="toggleAuto(2)">

        <div class="btn-auto" id="btnAuto502" onclick="toggleAuto50(2)">
          <span>50% Auto</span>
          <input type="number" id="inputAuto502" value="1.50" step="0.01" min="1.01" onclick="event.stopPropagation()">
        </div>
      </div>

      <div class="baris-taruhan">
        <button class="btn-chip" onclick="setTaruhan(2,1000)">1K</button>
        <button class="btn-chip" onclick="setTaruhan(2,5000)">5K</button>
        <div class="input-container">
          <input type="number" id="inputTaruhan2" class="input-taruhan" value="1000">
        </div>
        <button class="btn-chip" onclick="setTaruhan(2,10000)">10K</button>
        <button class="btn-chip" onclick="setTaruhan(2,50000)">50K</button>
      </div>

      <button class="tombol-utama btn-konfirmasi" id="btnMulai2" onclick="pasangTaruhan(2)">KONFIRMASI TARUHAN</button>
      <div id="grupTarik2" style="display: none; flex-direction: column; gap: 8px;">
        <button class="tombol-utama btn-tarik" id="btnTarik2" onclick="tarikDana(2)" style="display: block;">TARIK SEMUA</button>
        <button class="tombol-utama btn-setengah" id="btnSetengah2" onclick="tarikSetengah(2)">TARIK 50%</button>
      </div>

  <script type="module" src="../assets/firebase.js"></script>
  <script>
    // ================= STATE DASAR =================
    let saldoPemain = 0;
    let idUser = null;
    let usernamePemain = "Pemain";
    let multiplierSekarang = 1.00;
    let statusGame = "menunggu";
    let intervalNaik = null;
    let tabAktif = 1;
    let suaraAktif = true;

    let skenario = [];
    let indexSkenario = 0;
    let canvas, ctx;
    let dataGrafik = [];
    let animasiFrame;
    let seedRonde = "";
    let crashPointFinal = 2.00;

    // dua slot taruhan independen
    function slotKosong() {
      return { pasang: false, tarikSemua: false, tarikSetengah: false, nominal: 0, autoAktif: false, auto50Aktif: false };
    }
    let bet = { 1: slotKosong(), 2: slotKosong() };

    let daftarBot = [];
    const namaBot = ["Budi", "Siti", "Andi", "Rina", "Joko", "Agus", "Dewi", "Rizky", "Putri", "Fajar", "Lina", "Hendra", "Maya", "Doni", "Ayu", "Eko", "Nia", "Taufik", "Indah", "Bayu", "Fitri", "Rudi", "Sari", "Wawan", "Yuni", "Adi", "Tika", "Bambang", "Dian", "Iwan", "Lestari", "Reza", "Nina", "Hasan", "Sinta", "Asep", "Mega", "Yanto", "Kiki", "Rosa"];

    // ================= AUDIO (WebAudio, tanpa file eksternal) =================
    let audioCtx = null;
    function ambilAudioCtx() {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function bunyi(freq, durasi, tipe, volAwal) {
      if(!suaraAktif) return;
      try {
        const ctxA = ambilAudioCtx();
        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.type = tipe || "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volAwal || 0.15, ctxA.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctxA.currentTime + durasi);
        osc.connect(gain); gain.connect(ctxA.destination);
        osc.start(); osc.stop(ctxA.currentTime + durasi);
      } catch(e) {}
    }
    function suaraTick() { bunyi(440 + Math.min(multiplierSekarang * 25, 600), 0.05, "sine", 0.04); }
    function suaraCashout() { bunyi(660, 0.12, "triangle", 0.18); setTimeout(() => bunyi(880, 0.15, "triangle", 0.16), 90); }
    function suaraCrash() { bunyi(140, 0.4, "sawtooth", 0.2); }
    function suaraKlik() { bunyi(300, 0.04, "square", 0.05); }

    function toggleSuara() {
      suaraAktif = !suaraAktif;
      document.getElementById("btnSuara").classList.toggle("aktif", suaraAktif);
      document.getElementById("iconSuara").innerHTML = suaraAktif
        ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>'
        : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
    }

    // ================= TAB DUAL BET =================
    function pindahTab(n) {
      tabAktif = n;
      document.getElementById("tabBet1").classList.toggle("aktif", n===1);
      document.getElementById("tabBet2").classList.toggle("aktif", n===2);
      document.getElementById("slotBet1").classList.toggle("tampil", n===1);
      document.getElementById("slotBet2").classList.toggle("tampil", n===2);
      suaraKlik();
    }
    function refreshDotTab() {
      document.getElementById("dotBet1").style.display = bet[1].pasang ? "inline-block" : "none";
      document.getElementById("dotBet2").style.display = bet[2].pasang ? "inline-block" : "none";
    }

    function setTaruhan(slot, angka) { document.getElementById("inputTaruhan"+slot).value = angka; suaraKlik(); }
    function toggleAuto(slot) {
      bet[slot].autoAktif = !bet[slot].autoAktif;
      document.getElementById("btnAuto"+slot).classList.toggle("aktif", bet[slot].autoAktif);
    }
    function toggleAuto50(slot) {
      bet[slot].auto50Aktif = !bet[slot].auto50Aktif;
      document.getElementById("btnAuto50"+slot).classList.toggle("aktif", bet[slot].auto50Aktif);
    }

    function togglePanelBot() {
      document.getElementById("panelBot").classList.toggle("terbuka");
    }

    function tambahRiwayatAtas(nilai, isMerah) {
      const track = document.getElementById("trackRiwayat");
      let teksNilai = isMerah ? "0.00x" : nilai.toFixed(2) + "x";
      let htmlBaru = `<div class="riwayat-item ${isMerah ? 'merah' : ''}">${teksNilai}</div>`;
      track.insertAdjacentHTML('afterbegin', htmlBaru);
      if(track.children.length > 20) { track.removeChild(track.lastElementChild); }
    }

    async function muatRiwayatNyata() {
      if(!window.ambilRiwayatCrash) return;
      const riwayat = await window.ambilRiwayatCrash();
      const track = document.getElementById("trackRiwayat");
      
      if(riwayat.length === 0) {
        track.innerHTML = `<div class="riwayat-item">Belum ada riwayat</div>`;
        return;
      }

      let html = "";
      riwayat.forEach(r => {
        let isMerah = !r.menang;
        let teksNilai = isMerah ? "0.00x" : (r.multiplier ? r.multiplier.toFixed(2) + "x" : "WIN"); 
        html += `<div class="riwayat-item ${isMerah ? 'merah' : ''}">${teksNilai}</div>`;
      });
      
      track.innerHTML = html;
    }

    function inisialisasiBot() {
      daftarBot = [];
      let botDipilih = [...namaBot, ...namaBot].sort(() => 0.5 - Math.random()).slice(0, 40); 
      botDipilih.forEach((nama, index) => {
        daftarBot.push({ id: index, nama: nama, status: "menunggu", cashoutX: 0 });
      });
      renderPapanSkor();
    }

    function renderPapanSkor() {
      const wadah = document.getElementById("papanSkor");
      let html = "";

      [1,2].forEach(slot => {
        if(!bet[slot].pasang) return;
        let statusKamu = "Menunggu";
        let classKamu = "";
        if(bet[slot].tarikSemua) { statusKamu = "Win"; classKamu = "skor-win"; }
        else if(statusGame === "meledak") { statusKamu = "Lose"; classKamu = "skor-lose"; }
        else if(statusGame === "terbang") { statusKamu = "Terbang"; }
        html += `
          <div class="skor-item kamu">
            <span>${usernamePemain} (B${slot})</span>
            <span class="${classKamu}">${statusKamu}</span>
          </div>
        `;
      });

      daftarBot.forEach(botX => {
        let classStatus = "";
        if(botX.status === "win") classStatus = "skor-win";
        if(botX.status === "lose") classStatus = "skor-lose";
        let teks = botX.status === "menunggu" ? "..." : (botX.status === "win" ? botX.cashoutX.toFixed(2) + "x" : (botX.status === "lose" ? "Lose" : "Terbang"));
        html += `
          <div class="skor-item bot">
            <span>${botX.nama}</span>
            <span class="${classStatus}">${teks}</span>
          </div>
        `;
      });
      wadah.innerHTML = html;
    }

    function inisialisasiKanvas() {
      canvas = document.getElementById('kanvasGrafik');
      ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      dataGrafik = [];
      gambarUlangGrafik();
    }

    function gambarUlangGrafik() {
      if(!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if(dataGrafik.length === 0) { animasiFrame = requestAnimationFrame(gambarUlangGrafik); return; }

      let maxY = Math.max(...dataGrafik.map(d => d.high));
      let minY = Math.min(...dataGrafik.map(d => d.low));
      if(maxY < 1.5) maxY = 1.5; 
      if(minY > 0.5) minY = 0.5;
      let rangeY = maxY - minY;
      if(rangeY < 0.5) rangeY = 0.5;

      let lebarCandle = (canvas.width / dataGrafik.length) * 0.7;
      if(lebarCandle < 2) lebarCandle = 2;
      if(lebarCandle > 12) lebarCandle = 12;

      for(let i=0; i<dataGrafik.length; i++) {
        let d = dataGrafik[i];
        let x = (i / dataGrafik.length) * canvas.width + (canvas.width / dataGrafik.length)/2;
        
        let yOpen = canvas.height - ((d.open - minY) / rangeY) * (canvas.height - 20) - 10;
        let yClose = canvas.height - ((d.close - minY) / rangeY) * (canvas.height - 20) - 10;
        let yHigh = canvas.height - ((d.high - minY) / rangeY) * (canvas.height - 20) - 10;
        let yLow = canvas.height - ((d.low - minY) / rangeY) * (canvas.height - 20) - 10;

        let isNaik = d.close >= d.open;
        let warna = isNaik ? "#10b981" : "#ef4444";

        ctx.strokeStyle = warna; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, yHigh); ctx.lineTo(x, yLow); ctx.stroke();

        ctx.fillStyle = warna;
        let yBadan = Math.min(yOpen, yClose);
        let tinggiBadan = Math.abs(yOpen - yClose);
        if(tinggiBadan < 1) tinggiBadan = 1;
        ctx.fillRect(x - lebarCandle/2, yBadan, lebarCandle, tinggiBadan);
      }

      if(statusGame === "terbang") { animasiFrame = requestAnimationFrame(gambarUlangGrafik); }
    }

    window.addEventListener('load', () => {
      inisialisasiKanvas();
      mulaiRondeBaru();
    });

    setTimeout(() => {
      if(window.fbAuth) {
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          if(user) {
            idUser = user.uid;
            const snap = await window.fbGet(window.fbRef(window.fbDb, "users/" + user.uid));
            if(snap.exists()) {
              saldoPemain = Number(snap.val().balance);
              usernamePemain = snap.val().username;
              document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
            }
            muatRiwayatNyata();
          } else { window.location.href = "../index.html"; }
        });
      }
    }, 1000);

    // ================= BIAS DOMPET BANDAR =================
    // Baca target & saldo bandar dari Firebase (path sama dengan sistem window.mainkanGame di firebase.js),
    // lalu geser rentang crash point: makin jauh dari target -> makin ditekan (crash cepat).
    async function ambilBiasBandar() {
      let bias = 0; // -1 (tekan abis) .. 0 (netral) .. +1 (longgar abis)
      try {
        if(!window.fbGet || !window.fbRef || !window.fbDb) return bias;
        // path sesuai yang admin simpan: pengaturan/bandar
        const snap = await window.fbGet(window.fbRef(window.fbDb, "pengaturan/bandar"));
        if(!snap.exists()) return bias;
        const data = snap.val();
        const saldo = Number(data.dompetBandar || 0);
        const target = Number(data.target || 1);
        if(target <= 0) return bias;
        const rasio = saldo / target;
        if(rasio < 1) {
          bias = -Math.min(1, (1 - rasio));
        } else {
          bias = Math.min(1, (rasio - 1));
        }
      } catch(e) {}
      return bias;
    }

    // seed display doang (provably-fair look), bukan sumber acak kriptografis
    function buatSeedRonde() {
      const rand = Math.random().toString(16).slice(2, 10);
      const waktu = Date.now().toString(16).slice(-6);
      seedRonde = (rand + waktu).toUpperCase();
      document.getElementById("fairTag").textContent = "Round Seed: " + seedRonde;
    }

    async function buatSkenarioDrama() {
      skenario = [];
      let nilaiSekarang = 1.00;

      const bias = await ambilBiasBandar();
      // rentang dasar crash 1.5x - 16.5x, digeser oleh bias bandar
      let dasarMin = 1.5, dasarMax = 16.5;
      if(bias < 0) { dasarMax = dasarMax + (bias * 13); if(dasarMax < 1.3) dasarMax = 1.3; }
      if(bias > 0) { dasarMin = dasarMin + (bias * 3); dasarMax = dasarMax + (bias * 10); }
      if(dasarMax <= dasarMin) dasarMax = dasarMin + 0.3;

      let batasMeledak = dasarMin + Math.random() * (dasarMax - dasarMin);
      crashPointFinal = batasMeledak;

      let jumlahDrama = Math.floor(Math.random() * 5) + 3;
      
      for(let d=0; d<jumlahDrama; d++) {
        let naikKecil = nilaiSekarang + (Math.random() * 1.5) + 0.5;
        if(naikKecil > batasMeledak * 0.9) naikKecil = Math.max(nilaiSekarang + 0.1, batasMeledak * 0.9);
        skenario.push({ tipe: 'naik', target: naikKecil, durasi: 20 });
        nilaiSekarang = naikKecil;
        let turunEkstrem = nilaiSekarang - (Math.random() * (nilaiSekarang * 0.6));
        if(turunEkstrem < 1.05) turunEkstrem = 1.05;
        skenario.push({ tipe: 'turun_ekstrem', target: turunEkstrem, durasi: 15 });
        nilaiSekarang = turunEkstrem;
        let melesatNaik = nilaiSekarang + (Math.random() * 2) + 1;
        if(melesatNaik > batasMeledak * 0.95) melesatNaik = Math.max(nilaiSekarang + 0.1, batasMeledak * 0.95);
        skenario.push({ tipe: 'naik_ekstrem', target: melesatNaik, durasi: 15 });
        nilaiSekarang = melesatNaik;
      }
      skenario.push({ tipe: 'meledak', target: batasMeledak, durasi: 30 });
    }

    function resetSlot(slot) {
      bet[slot] = slotKosong();
      document.getElementById("btnMulai"+slot).style.display = "block";
      document.getElementById("btnMulai"+slot).disabled = false;
      document.getElementById("btnMulai"+slot).style.background = "#10b981";
      document.getElementById("btnMulai"+slot).style.color = "#000";
      document.getElementById("btnMulai"+slot).textContent = "KONFIRMASI TARUHAN";
      document.getElementById("grupTarik"+slot).style.display = "none";
      document.getElementById("panelKemenangan"+slot).style.display = "none";
      document.getElementById("btnSetengah"+slot).style.display = "none";
      document.getElementById("btnAuto"+slot).classList.remove("aktif");
      document.getElementById("btnAuto50"+slot).classList.remove("aktif");
    }

    async function mulaiRondeBaru() {
      statusGame = "menunggu";
      resetSlot(1);
      resetSlot(2);

      document.getElementById("teksPengali").style.display = "none";
      document.getElementById("teksHitung").style.display = "block";

      inisialisasiKanvas();
      buatSeedRonde();
      await buatSkenarioDrama();
      inisialisasiBot(); 
      indexSkenario = 0;
      
      let hitung = 10;
      document.getElementById("teksHitung").textContent = `NEXT GAME IN ${hitung}s`;
      renderPapanSkor();
      
      let intervalHitung = setInterval(() => {
        hitung--;
        if(hitung <= 0) {
          clearInterval(intervalHitung);
          mulaiTerbang();
        } else {
          document.getElementById("teksHitung").textContent = `NEXT GAME IN ${hitung}s`;
        }
      }, 1000);
    }

    function pasangTaruhan(slot) {
      if(!idUser) return alert("Sedang menghubungkan ke akun, tunggu 1 detik lagi...");
      if(statusGame === "terbang") return;
      if(bet[slot].pasang) return;

      const taruhan = Number(document.getElementById("inputTaruhan"+slot).value);
      if(taruhan < 100) return alert("Minimal taruhan Rp 100");
      if(taruhan > saldoPemain) return alert("Saldo tidak cukup!");

      saldoPemain -= taruhan;
      document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
      window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
      
      bet[slot].nominal = taruhan;
      bet[slot].pasang = true;
      bet[slot].autoAktif = document.getElementById("btnAuto"+slot).classList.contains("aktif");
      bet[slot].auto50Aktif = document.getElementById("btnAuto50"+slot).classList.contains("aktif");

      document.getElementById("btnMulai"+slot).textContent = "TARUHAN TERPASANG";
      document.getElementById("btnMulai"+slot).style.background = "#2d333b";
      document.getElementById("btnMulai"+slot).style.color = "#94a3b8";
      document.getElementById("btnMulai"+slot).disabled = true;
      
      suaraKlik();
      refreshDotTab();
      renderPapanSkor();
    }

    function mulaiTerbang() {
      statusGame = "terbang";
      multiplierSekarang = 1.00;
      document.getElementById("teksHitung").style.display = "none";
      document.getElementById("teksPengali").style.display = "block";
      document.getElementById("teksPengali").className = "angka-pengali";
      document.getElementById("teksPengali").textContent = "1.00x";
      
      [1,2].forEach(slot => {
        if(bet[slot].pasang) {
          document.getElementById("btnMulai"+slot).style.display = "none";
          document.getElementById("grupTarik"+slot).style.display = "flex";
          document.getElementById("btnSetengah"+slot).style.display = "block";
          document.getElementById("panelKemenangan"+slot).style.display = "block";
          document.getElementById("angkaKemenangan"+slot).textContent = bet[slot].nominal.toLocaleString('id-ID');
        }
      });

      dataGrafik.push({ open: 1, high: 1.01, low: 0.99, close: 1.00 });
      gambarUlangGrafik();

      daftarBot.forEach(botX => {
        botX.status = "terbang";
        botX.cashoutX = (Math.random() * 8) + 1.1;
      });
      renderPapanSkor();

      jalankanSkenario();
    }

    function jalankanSkenario() {
      if(indexSkenario >= skenario.length) return;
      
      let tahap = skenario[indexSkenario];
      let target = tahap.target;
      let tick = 0;
      let kecepatan = 0.05;
      if(tahap.tipe === 'naik_ekstrem') kecepatan = 0.2; 
      if(tahap.tipe === 'turun_ekstrem') kecepatan = 0.3; 
      
      intervalNaik = setInterval(() => {
        tick++;
        
        let arah = (target > multiplierSekarang) ? 1 : -1;
        let fluktuasi = (Math.random() - 0.5) * 0.05; 
        let perubahan = (kecepatan * arah) + fluktuasi;
        
        let openCandle = multiplierSekarang;
        multiplierSekarang += perubahan;
        let closeCandle = multiplierSekarang;
        
        if((arah === 1 && closeCandle > target) || (arah === -1 && closeCandle < target)) {
          closeCandle = target; multiplierSekarang = target;
        }

        let highCandle = Math.max(openCandle, closeCandle) + (Math.random() * 0.02);
        let lowCandle = Math.min(openCandle, closeCandle) - (Math.random() * 0.02);
        if(lowCandle < 0.5) lowCandle = 0.5;

        document.getElementById("teksPengali").textContent = multiplierSekarang.toFixed(2) + "x";
        if(tick % 3 === 0) suaraTick();

        [1,2].forEach(slot => {
          if(bet[slot].pasang && !bet[slot].tarikSemua) {
            let kemenanganSementara = Math.floor(bet[slot].nominal * multiplierSekarang);
            document.getElementById("angkaKemenangan"+slot).textContent = kemenanganSementara.toLocaleString("id-ID");
          }
        });

        dataGrafik.push({ open: openCandle, high: highCandle, low: lowCandle, close: closeCandle });

        let adaBotWin = false;
        daftarBot.forEach(botX => {
          if(botX.status === "terbang" && multiplierSekarang >= botX.cashoutX) {
            botX.status = "win";
            adaBotWin = true;
          }
        });
        if(adaBotWin) renderPapanSkor();

        [1,2].forEach(slot => {
          if(!bet[slot].pasang || bet[slot].tarikSemua) return;
          let ambangAuto = Number(document.getElementById("inputAuto"+slot).value) || 2.00;
          let ambangAuto50 = Number(document.getElementById("inputAuto50"+slot).value) || 1.50;
          if(bet[slot].autoAktif && multiplierSekarang >= ambangAuto) tarikDana(slot);
          if(!bet[slot].tarikSetengah && bet[slot].auto50Aktif && multiplierSekarang >= ambangAuto50) tarikSetengah(slot);
        });

        if(tick >= tahap.durasi || multiplierSekarang === target) {
          clearInterval(intervalNaik);
          if(tahap.tipe === 'meledak') { meledak(); } 
          else { indexSkenario++; setTimeout(jalankanSkenario, 300); }
        }
      }, 100); 
    }

    async function tarikSetengah(slot) {
      if(statusGame !== "terbang" || !bet[slot].pasang || bet[slot].tarikSetengah || bet[slot].tarikSemua) return;
      bet[slot].tarikSetengah = true;
      document.getElementById("btnSetengah"+slot).style.display = "none";
      
      const nilaiSekarang = bet[slot].nominal * multiplierSekarang;
      const dapatSetengah = Math.floor(nilaiSekarang / 2);
      
      saldoPemain += dapatSetengah;
      suaraCashout();
      if(idUser) {
        await window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
        document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
      }
      
      bet[slot].nominal = bet[slot].nominal / 2;
      renderPapanSkor();
    }

    async function tarikDana(slot) {
      if(statusGame !== "terbang" || !bet[slot].pasang || bet[slot].tarikSemua) return;
      bet[slot].tarikSemua = true;
      
      const nilaiSekarang = bet[slot].nominal * multiplierSekarang;
      const kemenangan = Math.floor(nilaiSekarang);
      
      document.getElementById("grupTarik"+slot).style.display = "none";
      document.getElementById("panelKemenangan"+slot).style.display = "none";
      suaraCashout();
      
      saldoPemain += kemenangan;
      if(idUser) {
        await window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
        document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
        
        if(window.fbSet) {
          await window.fbSet(window.fbRef(window.fbDb, "riwayat/" + Date.now() + "_" + idUser + "_b" + slot), {
            userId: idUser,
            username: usernamePemain,
            game: "Crash",
            menang: true,
            nominal: kemenangan,
            multiplier: parseFloat(multiplierSekarang.toFixed(2)),
            seed: seedRonde,
            waktu: new Date().toISOString()
          });
        }
      }

      tambahRiwayatAtas(multiplierSekarang, false);
      renderPapanSkor();
    }

    async function meledak() {
      clearInterval(intervalNaik);
      statusGame = "meledak";
      
      document.getElementById("teksPengali").className = "angka-pengali crashed";
      document.getElementById("teksPengali").textContent = "CRASH!";
      suaraCrash();

      [1,2].forEach(slot => {
        document.getElementById("grupTarik"+slot).style.display = "none";
        document.getElementById("panelKemenangan"+slot).style.display = "none";
      });

      dataGrafik.push({ open: multiplierSekarang, high: multiplierSekarang, low: 0, close: 0 });
      gambarUlangGrafik();

      daftarBot.forEach(botX => {
        if(botX.status === "terbang") botX.status = "lose";
      });
      renderPapanSkor();

      tambahRiwayatAtas(0, true);

      for(const slot of [1,2]) {
        if(!bet[slot].tarikSemua && bet[slot].pasang && idUser && window.fbSet) {
          await window.fbSet(window.fbRef(window.fbDb, "riwayat/" + Date.now() + "_" + idUser + "_b" + slot), {
            userId: idUser,
            username: usernamePemain,
            game: "Crash",
            menang: false,
            nominal: bet[slot].nominal,
            multiplier: 0,
            seed: seedRonde,
            waktu: new Date().toISOString()
          });
        }
      }
      
      setTimeout(mulaiRondeBaru, 4000); 
    }

    window.addEventListener('resize', inisialisasiKanvas);
  </script>
