<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crash — RHF 777</title>
  <!-- Library Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0a0a0f; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header Atas */
    .header-game { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #14141f; border-bottom: 1px solid #2a2a3a; }
    .tombol-kembali { color: #8b8b9e; text-decoration: none; font-size: 24px; }
    .saldo-game { font-size: 18px; font-weight: bold; color: #00e701; }

    /* Area Grafik (Full Screen sisa ruang) */
    .area-grafik { flex: 1; position: relative; background: #0a0a0f; width: 100%; }
    .angka-pengali { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 64px; font-weight: 900; color: #00e701; z-index: 10; text-shadow: 0 4px 15px rgba(0,231,1,0.3); }
    .angka-pengali.crashed { color: #ff3838; text-shadow: 0 4px 15px rgba(255,56,56,0.3); }
    canvas { width: 100% !important; height: 100% !important; }

    /* Panel Kontrol Bawah */
    .panel-kontrol { background: #14141f; border-top: 1px solid #2a2a3a; padding: 20px; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 20px rgba(0,0,0,0.5); z-index: 20; }
    
    /* Tombol Nominal Cepat */
    .grup-nominal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
    .btn-nominal { padding: 10px 0; background: #1e1e2e; border: 1px solid #2a2a3a; color: #fff; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-nominal:hover { background: #2a2a3a; border-color: #ffd700; }

    /* Input Taruhan */
    .wadah-input { position: relative; margin-bottom: 15px; }
    .input-taruhan { width: 100%; padding: 18px; background: #0a0a0f; border: 2px solid #2a2a3a; color: #fff; border-radius: 12px; font-size: 22px; font-weight: bold; outline: none; text-align: center; transition: border 0.2s; }
    .input-taruhan:focus { border-color: #00e701; }
    .label-taruhan { position: absolute; top: -10px; left: 20px; background: #14141f; padding: 0 5px; font-size: 12px; color: #8b8b9e; }

    /* Tombol Aksi */
    .btn-aksi { width: 100%; padding: 22px; border: none; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; transition: transform 0.1s; letter-spacing: 1px; }
    .btn-aksi:active { transform: scale(0.97); }
    .btn-mulai { background: linear-gradient(135deg, #00e701, #00b301); color: #000; box-shadow: 0 4px 15px rgba(0,231,1,0.3); }
    
    .grup-tombol { display: flex; gap: 10px; display: none; }
    .btn-setengah { flex: 1; background: #4a9eff; color: #fff; box-shadow: 0 4px 15px rgba(74,158,255,0.3); font-size: 16px; }
    .btn-tarik { flex: 2; background: linear-gradient(135deg, #ffd700, #ffb800); color: #000; box-shadow: 0 4px 15px rgba(255,215,0,0.3); }

    .pesan { margin-top: 15px; font-weight: bold; font-size: 14px; min-height: 20px; text-align: center; }
  </style>
</head>
<body>

  <!-- Header Atas -->
  <div class="header-game">
    <a href="../slot.html" class="tombol-kembali">←</a>
    <div class="saldo-game">Saldo: <span id="saldoSekarang">0</span></div>
  </div>
  
  <!-- Area Grafik Full Screen -->
  <div class="area-grafik">
    <div class="angka-pengali" id="teksPengali">1.00x</div>
    <canvas id="grafikCrash"></canvas>
  </div>
  
  <!-- Panel Kontrol Bawah -->
  <div class="panel-kontrol">
    <div id="panelInput">
      <div class="grup-nominal">
        <button class="btn-nominal" onclick="setTaruhan(1000)">1.000</button>
        <button class="btn-nominal" onclick="setTaruhan(5000)">5.000</button>
        <button class="btn-nominal" onclick="setTaruhan(10000)">10.000</button>
        <button class="btn-nominal" onclick="setTaruhan(50000)">50.000</button>
      </div>
      <div class="wadah-input">
        <span class="label-taruhan">BET (Rp)</span>
        <input type="number" id="inputTaruhan" class="input-taruhan" placeholder="0" value="1000">
      </div>
      <button class="btn-aksi btn-mulai" id="btnMulai" onclick="mulaiMain()">BELI TIKET</button>
    </div>
    
    <div class="grup-tombol" id="grupAksi">
      <button class="btn-aksi btn-setengah" id="btnSetengah" onclick="tarikSetengah()">TARIK 50%</button>
      <button class="btn-aksi btn-tarik" id="btnTarik" onclick="tarikDana()">TARIK SEMUA</button>
    </div>

    <div class="pesan" id="pesan"></div>
  </div>

  <script type="module" src="../assets/firebase.js"></script>
  <script>
    let saldoPemain = 0;
    let usernamePemain = "Pemain";
    let idUser = null;
    let multiplierSekarang = 1.00;
    let intervalNaik = null;
    let sedangMain = false;
    let sudahTarikSetengah = false;
    let taruhanAktif = 0;
    let grafik = null;
    let waktuSekarang = Date.now();

    // Fungsi Tombol Cepat
    function setTaruhan(angka) {
      document.getElementById("inputTaruhan").value = angka;
    }

    function siapkanGrafik() {
      const ctx = document.getElementById('grafikCrash').getContext('2d');
      grafik = new Chart(ctx, {
        type: 'candlestick',
        data: {
          datasets: [{
            label: 'Harga',
            data: [],
            color: { up: '#00e701', down: '#ff3838', unchanged: '#999' }
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { type: 'time', time: { unit: 'second' }, display: false },
            y: { display: false, beginAtZero: true } // Grafik tidak boleh minus
          }
        }
      });
    }

    setTimeout(() => {
      if(window.fbAuth) {
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          if(user) {
            idUser = user.uid;
            const snap = await window.fbGet(window.fbRef(window.fbDb, "users/" + user.uid));
            if(snap.exists()) {
              saldoPemain = Number(snap.val().balance);
              usernamePemain = snap.val().username;
              document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
            }
          } else {
            window.location.href = "../index.html";
          }
        });
      }
    }, 1000);

    async function mulaiMain() {
      if(sedangMain) return;
      const taruhan = Number(document.getElementById("inputTaruhan").value);
      
      if(taruhan < 100) return alert("Minimal taruhan Rp 100");
      if(taruhan > saldoPemain) return alert("Saldo tidak cukup!");

      sedangMain = true;
      sudahTarikSetengah = false;
      taruhanAktif = taruhan;
      multiplierSekarang = 1.00;
      waktuSekarang = Date.now();
      
      document.getElementById("teksPengali").textContent = "1.00x";
      document.getElementById("teksPengali").className = "angka-pengali";
      document.getElementById("pesan").textContent = "";
      
      document.getElementById("panelInput").style.display = "none";
      document.getElementById("grupAksi").style.display = "flex";
      document.getElementById("btnSetengah").style.display = "block";
      document.getElementById("btnSetengah").disabled = false;

      if(grafik) grafik.destroy();
      siapkanGrafik();
      
      // Potong saldo
      saldoPemain -= taruhanAktif;
      document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');

      let titikMeledak = 1.00;
      if(Math.random() > 0.3) titikMeledak = (Math.random() * 10) + 1; 

      intervalNaik = setInterval(() => {
        let kenaikan = 0.08;
        if(Math.random() > 0.7) kenaikan = -0.02; 
        
        multiplierSekarang += kenaikan;
        if(multiplierSekarang < 1) multiplierSekarang = 1;

        document.getElementById("teksPengali").textContent = multiplierSekarang.toFixed(2) + "x";
        
        if(grafik) {
          const o = multiplierSekarang - kenaikan;
          const c = multiplierSekarang;
          const h = Math.max(o, c) + (Math.random() * 0.02);
          const l = Math.min(o, c) - (Math.random() * 0.02);
          
          waktuSekarang += 1000;
          grafik.data.datasets[0].data.push({ x: waktuSekarang, o: o, h: h, l: l, c: c });
          grafik.update('none');
        }

        if(multiplierSekarang >= titikMeledak) {
          meledak();
        }
      }, 800); // Sedikit lebih cepat
    }

    async function tarikSetengah() {
      if(!sedangMain || sudahTarikSetengah) return;
      sudahTarikSetengah = true;
      document.getElementById("btnSetengah").disabled = true;
      
      const nilaiSekarang = taruhanAktif * multiplierSekarang;
      const dapatSetengah = Math.floor(nilaiSekarang / 2);
      
      saldoPemain += dapatSetengah;
      await window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
      document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
      
      document.getElementById("pesan").style.color = "#4a9eff";
      document.getElementById("pesan").textContent = `Tarik 50% sukses: +Rp ${dapatSetengah.toLocaleString('id-ID')}`;
      
      taruhanAktif = taruhanAktif / 2;
    }

    async function tarikDana() {
      if(!sedangMain) return;
      clearInterval(intervalNaik);
      sedangMain = false;
      
      const nilaiSekarang = taruhanAktif * multiplierSekarang;
      const kemenangan = Math.floor(nilaiSekarang);
      
      document.getElementById("grupAksi").style.display = "none";
      document.getElementById("panelInput").style.display = "block";
      document.getElementById("pesan").style.color = "#00e701";
      document.getElementById("pesan").textContent = `Menang! + Rp ${kemenangan.toLocaleString('id-ID')}`;

      saldoPemain += kemenangan;
      await window.fbUpdate(window.fbRef(window.fbDb, "users/" + idUser), { balance: saldoPemain });
      document.getElementById("saldoSekarang").textContent = saldoPemain.toLocaleString('id-ID');
      
      if(window.simpanRiwayat) window.simpanRiwayat(idUser, usernamePemain, "Crash", true, kemenangan);
    }

    async function meledak() {
      clearInterval(intervalNaik);
      sedangMain = false;
      
      document.getElementById("teksPengali").className = "angka-pengali crashed";
      document.getElementById("teksPengali").textContent = "CRASH!";
      document.getElementById("grupAksi").style.display = "none";
      document.getElementById("panelInput").style.display = "block";
      document.getElementById("pesan").style.color = "#ff3838";
      document.getElementById("pesan").textContent = sudahTarikSetengah ? "Sisa taruhan meledak!" : "Anda Kalah.";

      if(grafik) {
        const o = multiplierSekarang;
        const c = 0;
        const h = o;
        const l = 0;
        waktuSekarang += 1000;
        grafik.data.datasets[0].data.push({ x: waktuSekarang, o: o, h: h, l: l, c: c });
        grafik.update();
      }

      if(window.simpanRiwayat) window.simpanRiwayat(idUser, usernamePemain, "Crash", false, taruhanAktif);
    }
  </script>
</body>
</html>
