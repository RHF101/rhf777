<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dadu RHF 777</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    body { background: #0a0a0f; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; flex-direction: column; }
    .kotak { background: #14141f; border: 1px solid #ffd70040; border-radius: 16px; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
    .saldo { font-size: 20px; color: #00e701; font-weight: bold; margin-bottom: 20px; }
    .angka-dadu { font-size: 60px; font-weight: bold; color: #ffd700; margin: 20px 0; }
    .btn { width: 100%; padding: 15px; background: #ffd700; color: #000; font-weight: bold; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="kotak">
    <h2>Game Dadu</h2>
    <div class="saldo">Saldo: <span id="saldoSekarang">0</span></div>
    <input type="number" id="taruhan" placeholder="Masukkan taruhan..." style="width:100%; padding:10px; margin-bottom:10px; background:#0a0a0f; border:1px solid #2a2a3a; color:#fff; border-radius:6px;">
    <div class="angka-dadu" id="hasilDadu">?</div>
    <button class="btn" onclick="mainDadu()">Lempar Dadu</button>
    <p id="pesan" style="margin-top:15px; font-weight:bold;"></p>
    <a href="../slot.html" style="color:#8b8b9e; margin-top:20px; display:inline-block;">Kembali ke Slot</a>
  </div>

  <script type="module" src="../assets/firebase.js"></script>
  <script>
    let saldoPemain = 0;
    let usernamePemain = "Pemain";
    let idUser = null;
    let rtpBandar = 95; // Default peluang menang 95%
    let maxProfit = 0;

    // 1. Ambil Data Pemain & Pengaturan Bandar
    setTimeout(() => {
      if(window.fbAuth) {
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          if(user) {
            idUser = user.uid;
            const snap = await window.fbGet(window.fbRef(window.fbDb, "users/" + user.uid));
            if(snap.exists()) {
              saldoPemain = Number(snap.val().balance);
              usernamePemain = snap.val().username;
              document.getElementById("saldoSekarang").textContent = saldoPemain;
            }
          } else {
            alert("Silakan login terlebih dahulu!");
            window.location.href = "../index.html";
          }
        });
      }
      
      // Ambil pengaturan Bandar dari Admin
      window.fbGet(window.fbRef(window.fbDb, "pengaturan/bandar")).then(snap => {
        if(snap.exists()) {
          maxProfit = Number(snap.val().maxProfit) || 0;
          // Jika maxProfit diatur, kita turunkan peluang menang menjadi 40% (bandar lebih diuntungkan)
          if(maxProfit > 0) rtpBandar = 40; 
        }
      });
    }, 1000);

    async function mainDadu() {
      const taruhan = Number(document.getElementById("taruhan").value);
      if(taruhan <= 0 || taruhan > saldoPemain) return alert("Taruhan tidak valid atau saldo kurang!");

      // Kunci tombol sementara
      document.getElementById("hasilDadu").textContent = "...";

      // Panggil Mesin Bandar (dengan peluang menang dasar 50%)
      const hasil = await window.mainkanGame(idUser, taruhan, saldoPemain, 50);

      // Animasi Lempar Dadu
      let count = 0;
      const interval = setInterval(() => {
        document.getElementById("hasilDadu").textContent = Math.floor(Math.random() * 6) + 1;
        count++;
        if(count > 10) {
          clearInterval(interval);
          
          // Tampilkan hasil akhir
          document.getElementById("hasilDadu").textContent = Math.floor(Math.random() * 6) + 1;
          saldoPemain = hasil.saldoBaru;
          
          // Catat riwayat ke database
          if(window.simpanRiwayat) {
            window.simpanRiwayat(idUser, usernamePemain, "Dadu", hasil.menang, taruhan);
          }
          document.getElementById("saldoSekarang").textContent = saldoPemain;
          
          document.getElementById("pesan").style.color = hasil.menang ? "#00e701" : "#ff3838";
          document.getElementById("pesan").textContent = hasil.pesan;
        }
      }, 100);
    }
  </script>
</body>
</html>
