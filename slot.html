<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot — RHF 777</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- HEADER (SAMA UNTUK SEMUA HALAMAN) -->
  <div class="top-ticker">
    <div class="ticker-track">
      <span><b>Jackpot!</b> Budi*** menang <b>Rp 12.500.000</b></span>
      <span>Siti*** menang <b>Rp 8.700.000</b></span>
    </div>
  </div>
  
<header class="header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="bukaHalaman(&quot;beranda&quot;); return false;">
      <svg class="logo-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"></path><path d="M5 20h14"></path></svg>
      <span class="logo-text">RHF<span class="logo-num">777</span></span>
    </a>

    <div class="header-actions">
      <!-- Kotak Saldo dengan Ikon Koin -->
      <div class="balance-pill">
        <svg class="icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"></circle><path d="M18.09 10.37A6 6 0 1 1 10.34 18"></path><path d="M7 6h1v4"></path><path d="m16.71 13.88.7.71-2.82 2.82"></path></svg>
        <div class="balance-info">
          <span class="balance-label">Rp</span>
          <span class="balance-amount" id="balanceAmount">0</span>
        </div>
      </div>
      
      <!-- Tombol Deposit dan Daftar -->
      <button class="btn btn-primary" onclick="window.location.href='deposit.html'">+ Deposit</button>
      <button class="btn btn-gold" onclick="bukaAuth(); tampilkanDaftar();">Daftar</button>
    </div>
  </div>
</header>


  <!-- KONTEN SLOT -->
  <section class="section">
    <div class="container">
      <div class="wadah-pencarian" style="padding: 15px; background: #14141f; border-radius: 12px; margin-bottom: 20px;">
        <input type="text" class="input-cari" placeholder="Cari nama permainan..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a3a; background: #0a0a0f; color: #fff; margin-bottom: 0;">
      </div>
      <h2 style="font-size: 20px; margin-bottom: 15px;">Semua Permainan</h2>
      <div class="game-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;">
        <!-- Nanti game dari database akan muncul di sini -->
        <div style="grid-column: 1/-1; text-align: center; color: #8b8b9e; padding: 40px; background: #14141f; border-radius: 12px;">Belum ada game yang ditambahkan.</div>
      </div>
    </div>
  </section>

  <!-- MENU BAWAH -->
  

  <nav class="bottom-nav">
  <a href="index.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Beranda
  </a>
  <a href="slot.html" class="bn-item active">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle></svg>Slot
  </a>
  <a href="akun.html" class="bn-item bn-tengah">
    <div class="lingkaran-tengah">
      <svg class="bn-icon-tengah-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>
    <span class="teks-tengah">Akun</span>
  </a>
  <a href="promo.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>Promo
  </a>
  <a href="deposit.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>Deposit
  </a>
</nav>

<script type="module" src="assets/firebase.js"></script>
  <script src="assets/auth.js"></script>



<script type="module">
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      if(window.fbAuth && window.fbDb) {
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          const elSaldo = document.getElementById('balanceAmount');
          if (user) {
            const snap = await window.fbGet(window.fbRef(window.fbDb, "users/" + user.uid));
            if (snap.exists() && elSaldo) {
              elSaldo.textContent = Number(snap.val().balance).toLocaleString('id-ID');
            }
          } else if (elSaldo) {
            elSaldo.textContent = '0';
          }
        });
      }
    }, 1000);
  });
</script>

</body>

</html>
