<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dasbor RHF 777</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { background-color: #0a0a0f; padding: 20px; }
    .wadah-dasbor { max-width: 800px; margin: 0 auto; }
    .kepala { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #2a2a3a; }
    .kotak-tabel { background: #14141f; border: 1px solid #2a2a3a; border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #2a2a3a; font-size: 14px; }
    th { background: #1e1e2e; color: #8b8b9e; font-size: 12px; text-transform: uppercase; }
    .saldo { font-weight: bold; color: #00e701; }
    .btn-ubah { background: #ffd700; color: #000; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; border: none; margin-right: 4px;}
  </style>
</head>
<body>

<div class="wadah-dasbor">
  <div class="kepala">
    <h1 style="color: #ffd700; font-size: 22px;">Dasbor Pengelola</h1>
    <button class="btn btn-outline" onclick="sessionStorage.removeItem('akses_pengelola'); window.location.href='masuk-rahasia.html';">Keluar</button>
  </div>

  <div class="kotak-tabel">
    <table>
      <thead>
        <tr>
          <th>Nama & Telepon</th>
          <th>Saldo</th>
          <th style="text-align: right;">Aksi</th>
        </tr>
      </thead>
      <tbody id="isi-tabel">
        <tr><td colspan="3" style="text-align: center; padding: 30px;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zteyvjflniyehvnjakvd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_m2VxTR2Q4WTN4LvmkEMHFQ_ySEwcAzf';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function muatData() {
    const tabel = document.getElementById('isi-tabel');
    const { data, error } = await db.from('profiles').select('*').order('created_at', { ascending: false });

    if (error || !data) {
      tabel.innerHTML = `<tr><td colspan="3" style="color: #ff3838;">Gagal memuat data.</td></tr>`;
      return;
    }

    if (data.length === 0) {
      tabel.innerHTML = `<tr><td colspan="3" style="text-align: center;">Belum ada pengguna.</td></tr>`;
      return;
    }

    tabel.innerHTML = data.map(user => `
      <tr>
        <td>
          <div style="font-weight: bold; color: #fff;">${user.username || 'Tanpa Nama'}</div>
          <div style="font-size: 12px; color: #8b8b9e;">${user.phone || 'Tidak ada nomor'}</div>
        </td>
        <td class="saldo">Rp ${Number(user.balance).toLocaleString('id-ID')}</td>
        <td style="text-align: right;">
          <button class="btn-ubah" onclick="ubahSaldo('${user.id}', ${user.balance})">+ / - Saldo</button>
        </td>
      </tr>
    `).join('');
  }

  async function ubahSaldo(id, saldoSaatIni) {
    const input = prompt("Masukkan nominal (contoh: 50000 atau -20000):");
    if (!input) return;

    const jumlah = Number(input);
    if (isNaN(jumlah)) { alert("Nominal tidak valid."); return; }

    let saldoBaru = saldoSaatIni + jumlah;
    if (saldoBaru < 0) saldoBaru = 0;

    const { error } = await db.from('profiles').update({ balance: saldoBaru }).eq('id', id);
    
    if (error) alert("Gagal mengubah saldo.");
    else muatData();
  }

  muatData();
</script>
</body>
</html>
