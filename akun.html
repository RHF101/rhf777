<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun Saya — RHF 777</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .profil-kotak {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-top: 20px;
    }
    .foto-profil {
      width: 80px; height: 80px;
      background: var(--surface-2);
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--gold);
    }
    .menu-akun {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 20px;
      overflow: hidden;
    }
    .baris-akun {
      display: flex; justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      color: #fff; text-decoration: none;
    }
    .baris-akun:last-child { border-bottom: none; }
    .baris-akun:hover { background: var(--surface-2); }
  </style>
</head>
<body style="padding-bottom: 80px;">

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><span class="logo-text">RHF<span class="logo-num">777</span></span></a>
  </div>
</header>

<div class="container">
  <div class="profil-kotak" id="kotakProfil">
    <div class="foto-profil">
      <img src="assets/img/akun.png" alt="User" style="width: 40px; opacity: 0.5;" onerror="this.style.display='none'">
    </div>
    <h2 id="namaUser" style="color: var(--gold); margin-bottom: 4px;">Memuat...</h2>
    <p id="surelUser" style="color: var(--text-dim); font-size: 14px;">Silakan masuk terlebih dahulu</p>
    
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
      <div style="font-size: 12px; color: var(--text-dim);">Total Saldo</div>
      <div style="font-size: 28px; font-weight: bold; color: #00e701;" id="saldoUser">Rp 0</div>
    </div>
  </div>

  <div class="menu-akun">
    <a href="#" class="baris-akun" onclick="alert('Fitur segera hadir')">Riwayat Transaksi <span>></span></a>
    <a href="#" class="baris-akun" onclick="alert('Fitur segera hadir')">Ubah Kata Sandi <span>></span></a>
    <a href="#" class="baris-akun" onclick="alert('Fitur segera hadir')">Hubungi Dukungan <span>></span></a>
    <a href="#" class="baris-akun" onclick="keluarAkun(); return false;" style="color: #ff3838;">Keluar Akun <span>></span></a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script>
  async function periksaAkun() {
    const data = await window.ambilProfil();
    
    if (data && data.user) {
      document.getElementById('namaUser').textContent = data.profil.username;
      document.getElementById('surelUser').textContent = data.user.email;
      document.getElementById('saldoUser').textContent = 'Rp ' + Number(data.profil.balance).toLocaleString('id-ID');
    } else {
      document.getElementById('namaUser').textContent = 'Tamu';
    }
  }
  
  function keluarAkun() {
    if(typeof window.prosesKeluar === 'function') {
      window.prosesKeluar();
      window.location.href = 'index.html';
    }
  }

  periksaAkun();
</script>
</body>
</html>

  </a>

    <img src="assets/img/slot.png" alt="Slot" class="bn-icon" onerror="this.style.display='none'">Slot
  </a>
  <a href="akun.html" class="bn-item bn-tengah">
    <div class="lingkaran-tengah">
      <img src="assets/img/akun.png" alt="Akun" class="bn-icon-tengah" onerror="this.style.display='none'">
    </div>
    <span class="teks-tengah">Akun</span>
  </a>
  <a href="promosi.html" class="bn-item">
    <img src="assets/img/promo.png" alt="Promosi" class="bn-icon" onerror="this.style.display='none'">Promo
  </a>
  <a href="index.html" class="bn-item" onclick="openDeposit(); return false;">
    <img src="assets/img/koin.png" alt="Deposit" class="bn-icon" onerror="this.style.display='none'">Deposit
  </a>
</nav>
