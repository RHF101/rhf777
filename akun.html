<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun Saya — RHF 777</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-text">RHF<span class="logo-num">777</span></span></a>
      <div class="header-actions" style="margin-left: auto;">
        <button class="btn btn-gold" onclick="window.location.href='deposit.html'">+ Deposit</button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width: 600px;">
      <div style="background: linear-gradient(135deg, #1e1e2e, #14141f); border: 1px solid #ffd70040; border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px;">
        <div id="peringatanBan" style="display:none; background:#ff3838; color:#fff; padding:10px; border-radius:8px; margin-bottom:15px; font-weight:bold;">AKUN ANDA DIBLOKIR (BANNED)</div>
        <h2 id="namaAkun" style="color: #fff; font-size: 22px;">Memuat...</h2>
        <p id="surelAkun" style="color: #8b8b9e; font-size: 14px; margin-bottom: 16px;">-</p>
        <div style="font-size: 12px; color: #8b8b9e;">Total Saldo</div>
        <div style="font-size: 24px; font-weight: bold; color: #00e701;" id="saldoAkun">Rp 0</div>
      </div>

      
      <div style="background: #14141f; border: 1px solid #2a2a3a; border-radius: 12px; margin-bottom: 20px; overflow: hidden;">
        <div style="padding: 12px 16px; border-bottom: 1px solid #2a2a3a; font-size: 12px; font-weight: bold; color: #ffd700; background: #1a1a2e;">RIWAYAT PERMAINAN</div>
        <div id="kotakRiwayat" style="padding: 16px; font-size: 14px; color: #8b8b9e; text-align: center;">Memuat riwayat...</div>
      </div>
      <button onclick="keluarAkun()" style="width: 100%; padding: 16px; background: rgba(255, 56, 56, 0.1); border: 1px solid #ff3838; color: #ff3838; border-radius: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Keluar Akun
      </button>

    </div>
  </section>

  

  <nav class="bottom-nav">
  <a href="index.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Beranda
  </a>
  <a href="slot.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle></svg>Slot
  </a>
  <a href="akun.html" class="bn-item bn-tengah active">
    <div class="lingkaran-tengah">
      <svg class="bn-icon-tengah-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>
    <span class="teks-tengah">Akun</span>
  </a>
  <a href="promo.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>Promo
  </a>
  <a href="deposit.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>Deposit
  </a>
</nav>

<script type="module" src="assets/firebase.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    window.onload = () => {
      setTimeout(async () => {
        if(!window.fbAuth) return;
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          if(user) {
            const snap = await window.fbGet(window.fbRef(window.fbDb, "users/"+user.uid));
            if(snap.exists()){
              const data = snap.val();
              document.getElementById('namaAkun').textContent = data.username;
              document.getElementById('surelAkun').textContent = data.email;
              document.getElementById('saldoAkun').textContent = "Rp " + Number(data.balance).toLocaleString("id-ID");
            }
          } else {
            window.location.href = "index.html";
          }
        });
      }, 1000);
    };
    
    
    setTimeout(() => {
      if(window.fbAuth) {
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          if(user) {
            const snap = await window.fbGet(window.fbRef(window.fbDb, "riwayat"));
            const kotak = document.getElementById("kotakRiwayat");
            let htmlRiwayat = "";
            let count = 0;
            
            if(snap.exists()) {
              let dataArray = [];
              snap.forEach(child => {
                const val = child.val();
                if(val.userId === user.uid) dataArray.push(val);
              });
              dataArray.reverse(); // Urutkan dari yang terbaru
              
              dataArray.forEach(data => {
                if(count >= 5) return; // Maksimal 5 riwayat
                const warna = data.menang ? "#00e701" : "#ff3838";
                const teks = data.menang ? "MENANG" : "KALAH";
                htmlRiwayat += `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #2a2a3a; padding:10px 0;">
                  <span style="color:#fff;">${data.game}</span>
                  <span style="color:${warna}; font-weight:bold;">${teks} Rp ${Number(data.nominal).toLocaleString("id-ID")}</span>
                </div>`;
                count++;
              });
            }
            
            if(kotak) kotak.innerHTML = htmlRiwayat || "Belum ada riwayat permainan.";
          }
        });
      }
    }, 1500);

    function keluarAkun() {
      if(confirm("Apakah Anda yakin ingin keluar?")) {
        if(window.fbSignOut) {
          window.fbSignOut(window.fbAuth).then(() => {
            window.location.href = "index.html";
          });
        }
      }
    }

  </script>
</body>
</html>
