<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit & Widrow — RHF 777</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Desain Tab Atas */
    .tab-dana { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-dana button { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .tab-dana .btn-aktif { background: #00e701; color: #000; box-shadow: 0 4px 15px rgba(0, 231, 1, 0.3); }
    .tab-dana .btn-mati { background: #1e1e2e; color: #8b8b9e; }
    
    /* Desain Metode Pembayaran */
    .metode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; padding: 0 30px; }
    .metode-item { cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
    .kotak-logo { 
      width: 100%; height: 45px; background: #fff; border: 1px solid #2a2a3a; border-radius: 8px; 
      overflow: hidden; margin-bottom: 8px; /* Jarak antara kotak dan tulisan */
    }
    .kotak-logo img { width: 100%; height: 100%; object-fit: fill; display: block; }
    .metode-item span { display: block; font-size: 12px; color: #fff; font-weight: bold; text-align: center; }
    .metode-item:hover .kotak-logo { border-color: #ffd700; }
    
    /* Desain Tombol Nominal */
    .nominal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .nominal-grid button { background: #0a0a0f; border: 1px solid #2a2a3a; color: #fff; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .nominal-grid button:hover { background: #1e1e2e; border-color: #ffd700; }

    /* Desain Input */
    .input-nominal { width: 100%; padding: 14px; background: #0a0a0f; border: 1px solid #2a2a3a; color: #fff; border-radius: 8px; margin-bottom: 20px; font-size: 16px; outline: none; box-sizing: border-box; }
    .input-nominal:focus { border-color: #ffd700; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-text">RHF<span class="logo-num">777</span></span></a>
      <div class="header-actions" style="margin-left: auto;">
        <div class="balance-pill">
          <div class="balance-info"><span class="balance-amount" id="balanceAmount">Rp 0</span></div>
        </div>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width: 500px;">
      <h2 style="font-size: 20px; margin-bottom: 20px;">Pusat Dana</h2>
      
      <div class="tab-dana">
        <button id="btnTabDeposit" class="btn-aktif" onclick="gantiTab('deposit')">Deposit</button>
        <button id="btnTabWidrow" class="btn-mati" onclick="gantiTab('widrow')">Widrow (Tarik)</button>
      </div>

      <div style="background: #14141f; border: 1px solid #2a2a3a; padding: 24px; border-radius: 12px;">
        <h3 id="judulForm" style="color: #ffd700; margin-bottom: 20px; font-size: 16px;">Simulasi Deposit</h3>
        
        <p style="color: #8b8b9e; font-size: 12px; margin-bottom: 10px;">Pilih Metode Pembayaran:</p>
        
        <!-- METODE PEMBAYARAN DIPERBAIKI -->
        <div class="metode-grid">
          <div class="metode-item" onclick="alert('Metode GoPay terpilih!')">
            <div class="kotak-logo"><img src="https://cdn.corenexis.com/f/nEzAltWh8wT.jpg"></div>
            <span>GoPay</span>
          </div>
          <div class="metode-item" onclick="alert('Metode OVO terpilih!')">
            <div class="kotak-logo"><img src="https://cdn.corenexis.com/f/awCCd3xHwKJ.jpg"></div>
            <span>OVO</span>
          </div>
          <div class="metode-item" onclick="alert('Metode DANA terpilih!')">
            <div class="kotak-logo"><img src="https://cdn.corenexis.com/f/3BlB6Sa8xmv.jpg"></div>
            <span>DANA</span>
          </div>
        </div>

        <p style="color: #8b8b9e; font-size: 12px; margin-bottom: 10px;">Pilih Nominal:</p>
        <div class="nominal-grid">
          <button onclick="isiNominal(10000)">Rp 10.000</button>
          <button onclick="isiNominal(50000)">Rp 50.000</button>
          <button onclick="isiNominal(100000)">Rp 100.000</button>
          <button onclick="isiNominal(500000)">Rp 500.000</button>
        </div>

        <input type="number" id="inputNominal" class="input-nominal" placeholder="Atau ketik nominal lain...">
        <input type="tel" id="inputNomorTujuan" class="input-nominal" placeholder="Masukkan Nomor DANA/OVO Tujuan" style="display:none; margin-top:-10px;">
        
        <button class="btn btn-gold" style="width:100%; padding: 14px; font-size: 15px;" onclick="prosesSekarang()" id="btnProses">Konfirmasi Deposit</button>
      </div>

      <div id="pesan" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px;"></div>
    </div>
  </section>

  <nav class="bottom-nav">
    <a href="index.html" class="bn-item"><svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Beranda</a>
    <a href="slot.html" class="bn-item"><svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>Slot</a>
    <a href="akun.html" class="bn-item bn-tengah"><div class="lingkaran-tengah"><svg class="bn-icon-tengah-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div><span class="teks-tengah">Akun</span></a>
    <a href="promo.html" class="bn-item"><svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect></svg>Promo</a>
    <a href="deposit.html" class="bn-item active"><svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>Deposit</a>
  </nav>

  <script type="module" src="assets/firebase.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    let userSekarang = null;
    let usernameSekarang = "Pemain";
    let modeSekarang = "deposit";

    setTimeout(() => {
      if(window.fbAuth) {
        window.fbOnAuthStateChanged(window.fbAuth, async (user) => {
          const elSaldo = document.getElementById('balanceAmount');
          if(user) {
            userSekarang = user;
            const snap = await window.fbGet(window.fbRef(window.fbDb, "users/" + user.uid));
            if(snap.exists()) {
              usernameSekarang = snap.val().username;
              if(elSaldo) elSaldo.textContent = Number(snap.val().balance).toLocaleString('id-ID');
            }
          } else {
            if(elSaldo) elSaldo.textContent = '0';
          }
        });
      }
    }, 1000);

    function gantiTab(mode) {
      modeSekarang = mode;
      const btnDep = document.getElementById('btnTabDeposit');
      const btnWid = document.getElementById('btnTabWidrow');
      const judul = document.getElementById('judulForm');
      const btnProses = document.getElementById('btnProses');

      if(mode === 'deposit') {
        btnDep.className = 'btn-aktif'; btnWid.className = 'btn-mati';
        judul.textContent = 'Simulasi Deposit'; btnProses.textContent = 'Konfirmasi Deposit'; document.getElementById('inputNomorTujuan').style.display = 'none';
      } else {
        btnDep.className = 'btn-mati'; btnWid.className = 'btn-aktif';
        judul.textContent = 'Simulasi Widrow (Tarik)'; btnProses.textContent = 'Konfirmasi Penarikan'; document.getElementById('inputNomorTujuan').style.display = 'block';
      }
      document.getElementById('pesan').textContent = "";
    }

    function isiNominal(angka) { document.getElementById('inputNominal').value = angka; }

    async function prosesSekarang() {
      if(!userSekarang) return alert("Silakan login terlebih dahulu!");
      const nominal = Number(document.getElementById('inputNominal').value);
      if(!nominal || nominal < 1000) return alert("Minimal Rp 1.000");

      const btn = document.getElementById('btnProses');
      const pesan = document.getElementById('pesan');
      btn.disabled = true; btn.textContent = "Memproses...";

      try {
        let hasil;
        if(modeSekarang === 'deposit') {
          hasil = await window.prosesDeposit(userSekarang.uid, usernameSekarang, nominal);
          pesan.style.color = "#00e701";
          pesan.textContent = `Berhasil deposit Rp ${nominal.toLocaleString('id-ID')}!`;
        } else {
          const nomorTujuan = document.getElementById("inputNomorTujuan").value;
          if(!nomorTujuan) return alert("Masukkan nomor tujuan DANA/OVO Anda!");
          hasil = await window.ajukanWidrow(userSekarang.uid, usernameSekarang, nominal, nomorTujuan, "Manual");
          pesan.style.color = "#ffb800";
          pesan.textContent = `Penarikan Rp ${nominal.toLocaleString('id-ID')} sedang diproses Admin.`;
        }!`;
        }
        
        document.getElementById('balanceAmount').textContent = hasil.saldoBaru.toLocaleString('id-ID');
        document.getElementById('inputNominal').value = "";

      } catch (err) {
        pesan.style.color = "#ff3838";
        pesan.textContent = "Gagal: " + err.message;
      } finally {
        btn.textContent = modeSekarang === 'deposit' ? 'Konfirmasi Deposit' : 'Konfirmasi Penarikan';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
