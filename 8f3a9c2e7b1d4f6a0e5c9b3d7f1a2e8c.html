<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404: NOT_FOUND</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      user-select: none;
    }
    .kotak-eror {
      background-color: #0a0a0a;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #ededed;
    }
    .judul {
      font-size: 20px;
      font-weight: bold;
      color: #ff0000;
      margin-bottom: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .teks-biasa {
      margin-bottom: 10px;
      color: #888888;
    }
    .teks-putih { color: #ffffff; }
    .tautan {
      color: #0070f3;
      text-decoration: none;
    }
    .tautan:hover { text-decoration: underline; }
    .tombol-debug {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
    }
    .sembunyi { display: none; }
    
    /* Gaya untuk panel asli */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: #14141f;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      color: #fff;
    }
    .modal-content h3 { margin-bottom: 16px; color: #ffd700; }
    .tombol-menu {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }
    .tombol-tutup {
      background: none;
      border: none;
      color: #8b8b9e;
      cursor: pointer;
      float: right;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- BAGIAN TAMPILAN ERROR VERCEL -->
  <div class="kotak-eror">
    <div class="judul">404: NOT_FOUND</div>
    
    <div class="teks-biasa">Code: <span class="teks-putih">NOT_FOUND</span></div>
    <!-- Tulisan ID ini yang harus diklik 1000 kali -->
    <div class="teks-biasa">ID: <span class="teks-putih" id="teksKlik" style="cursor: pointer;">sin1::8xwn7-1792205638663-5f7586ae03f7</span></div>
    
    <div class="teks-biasa" style="margin-top: 10px;">
      <a href="https://vercel.com/docs/errors/not_found" class="tautan" target="_blank">Docs for this error code</a>
    </div>

    <a href="https://vercel.com/docs/errors/not_found" class="tombol-debug" target="_blank">Debug this error</a>
  </div>

  <!-- PANEL ASLI YANG TERSEMBUNYI -->
  <div class="modal" id="modalAsli">
    <div class="modal-content">
      <button class="tombol-tutup" onclick="document.getElementById('modalAsli').classList.remove('open')">Tutup</button>
      <h3>Panel Pengelola</h3>
      <p style="margin-bottom: 16px; font-size: 14px; color: #8b8b9e;">Anda berhasil masuk.</p>
      
      <button class="tombol-menu" onclick="alert('Fitur pengguna akan segera hadir')">Kelola Pengguna</button>
      <button class="tombol-menu" onclick="alert('Fitur RTP akan segera hadir')">Pengaturan RTP</button>
      <button class="tombol-menu" onclick="alert('Fitur saldo akan segera hadir')">Tambah Saldo</button>
      <button class="tombol-menu" onclick="alert('Fitur transaksi akan segera hadir')">Riwayat Transaksi</button>
    </div>
  </div>

<script>
  let jumlahKlik = 0;
  const targetKlik = 1000;

  document.getElementById('teksKlik').addEventListener('click', function() {
    jumlahKlik++;

    // Kalau mencapai target, buka panel asli
    if (jumlahKlik >= targetKlik) {
      document.getElementById('modalAsli').classList.add('open');
      jumlahKlik = 0; // Reset agar bisa dipakai lagi
    }
  });
</script>

</body>
</html>
