<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galat Sistem</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      cursor: default;
    }
    .gambar-eror {
      max-width: 100%;
      max-height: 90vh;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
      cursor: pointer;
    }
    /* Sembunyikan penghitung agar tidak mencurigakan */
    .penghitung {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Gambar kesalahan palsu -->
  <img 
    src="https://cdn.corenexis.com/f/6EW8jWznheC.jpg" 
    alt="Kesalahan Sistem" 
    class="gambar-eror" 
    id="gambarTipuan"
    onclick="hitungKlik()"
    oncontextmenu="return false;"
  >

  <span class="penghitung" id="jumlahKlik">0</span>

<!-- JENDELA PANEL ASLI -->
<div class="modal" id="modalAsli">
  <div class="modal-content" style="text-align: left;">
    <button class="modal-close" onclick="document.getElementById('modalAsli').classList.remove('open')">Tutup</button>
    <h3 style="color: #ffd700; margin-bottom: 16px;">Panel Pengelola RHF 777</h3>
    <p style="color: #8b8b9e; margin-bottom: 16px;">Selamat datang. Anda berhasil masuk.</p>
    
    <div style="display: grid; gap: 8px;">
      <button class="btn btn-gold" onclick="bukaMenu('Kelola Pengguna')">Kelola Pengguna</button>
      <button class="btn btn-gold" onclick="bukaMenu('Pengaturan RTP')">Pengaturan RTP</button>
      <button class="btn btn-gold" onclick="bukaMenu('Tambah Saldo')">Tambah Saldo</button>
      <button class="btn btn-gold" onclick="bukaMenu('Riwayat Transaksi')">Riwayat Transaksi</button>
    </div>
  </div>
</div>

<!-- JENDELA UNTUK FITUR PANEL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">Tutup</button>
    <h3 id="modalTitle">Menu</h3>
    <p id="modalBody">Fitur ini sedang dalam pengembangan.</p>
  </div>
</div>

<script>
  // ============ HITUNG KLIK ============
  let klikSekarang = 0;
  const klikTarget = 1000;

  function hitungKlik() {
    klikSekarang++;
    document.getElementById('jumlahKlik').textContent = klikSekarang;

    // Memberikan efek getar sedikit di layar sebagai isyarat ada yang berubah
    if (klikSekarang % 100 === 0 && klikSekarang < klikTarget) {
      document.body.style.transform = 'translateX(2px)';
      setTimeout(() => { document.body.style.transform = 'translateX(0)'; }, 50);
    }

    // Kalau sudah 1000 kali, buka panel asli
    if (klikSekarang >= klikTarget) {
      document.getElementById('modalAsli').classList.add('open');
      klikSekarang = 0; // Reset agar bisa disembunyikan lagi
    }
  }

  // ============ FUNGSI JENDELA ============
  function bukaMenu(judul) {
    document.getElementById('modalTitle').textContent = judul;
    document.getElementById('modalBody').textContent = 'Fitur ini akan segera tersedia.';
    document.getElementById('modal').classList.add('open');
  }
</script>

</body>
</html>
