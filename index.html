<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RHF 777 — Situs Game Daring</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- BAGIAN ATAS -->
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo">
      <svg class="logo-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"></path><path d="M5 20h14"></path></svg>
      <span class="logo-text">RHF<span class="logo-num">777</span></span>
    </a>

    <nav class="nav">
      <a href="index.html" class="nav-link active">Beranda</a>
      <a href="slot.html" class="nav-link">Slot</a>
      <a href="promosi.html" class="nav-link">Promosi</a>
    </nav>

    <div class="header-actions">
      <button class="btn btn-gold" onclick="openRegister()">Daftar</button>
    </div>

    <!-- TOMBOL MENU PONSEL -->
    <button class="hamburger" onclick="toggleMobileMenu(event)">Menu</button>
  </div>

  <!-- MENU PONSEL (Diletakkan di dalam header agar posisinya pas di bawah) -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Beranda</a>
    <a href="slot.html">Slot</a>
    <a href="promosi.html">Promosi</a>
    <a href="akun.html">Akun Saya</a>
    <div class="mobile-menu-actions">
      <button class="btn btn-outline" onclick="openLogin()">Masuk</button>
      <button class="btn btn-gold" onclick="openRegister()">Daftar</button>
    </div>
  </div>
</header>

<!-- BAGIAN UTAMA (HERO) -->
<section class="hero">
  <div class="hero-glow"></div>
  <div class="hero-content">
    <div class="hero-badge">MEMBER BARU · KHUSUS HARI INI</div>
    <h1 class="hero-title">BONUS <span class="gold-text">100%</span><br>DI DEPAN</h1>
    <p class="hero-sub">Minimal deposit Rp 10.000 · Proses instan 1 menit · Daring 24/7</p>
    <div class="hero-actions">
      <button class="btn btn-gold btn-lg" onclick="openRegister()">Klaim Bonus</button>
    </div>
  </div>
</section>

<!-- KATEGORI -->
<section class="section">
  <div class="container">
    <div class="section-header">
      <h2>Permainan Populer</h2>
      <a href="slot.html" class="link-more">Lihat Semua</a>
    </div>
    <div class="game-grid" id="gameGridPopuler"></div>
  </div>
</section>

<!-- MENU BAWAH PONSEL -->
<nav class="bottom-nav">
  <a href="index.html" class="bn-item active">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Beranda
  </a>
  <a href="slot.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg>Slot
  </a>
  <a href="akun.html" class="bn-item bn-tengah">
    <div class="lingkaran-tengah">
      <svg class="bn-icon-tengah-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>
    <span class="teks-tengah">Akun</span>
  </a>
  <a href="promosi.html" class="bn-item">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect></svg>Promo
  </a>
  <a href="#" class="bn-item" onclick="openDeposit(); return false;">
    <svg class="bn-icon-vektor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>Deposit
  </a>
</nav>

<!-- JENDELA MELAYANG UMUM -->
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">Tutup</button>
    <h3 id="modalTitle">Segera Hadir</h3>
    <p id="modalBody">Fitur ini akan segera tersedia.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
